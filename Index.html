<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📤 Kirim ke Telegram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f0f8ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:rgba(12,20,35,.9);backdrop-filter:blur(20px);border:1px solid rgba(0,180,255,.12);border-radius:24px;padding:28px 20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8);text-align:center}
h1{font-size:26px;font-weight:900;margin-bottom:4px}
h1 span{color:#00d4ff}
.sub{color:#8899bb;font-size:14px;margin-bottom:20px}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{display:block;font-size:13px;color:#8899bb;margin-bottom:4px;font-weight:600}
.input-group input,.input-group select{width:100%;padding:12px 14px;background:rgba(0,0,0,.5);border:1px solid rgba(0,180,255,.12);border-radius:12px;color:#f0f8ff;font-size:15px;outline:0;transition:.3s}
.input-group input:focus,.input-group select:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,180,255,.1)}
.input-group select option{background:#0a0a0a;color:#f0f8ff}
.btn{width:100%;padding:14px;border:0;border-radius:40px;font-weight:700;font-size:15px;cursor:pointer;transition:.3s;margin-top:4px}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#0066ff);color:#fff;box-shadow:0 4px 20px rgba(0,180,255,.2)}
.btn-primary:active{transform:scale(0.97)}
.btn-success{background:linear-gradient(135deg,#00ff88,#00cc66);color:#000;box-shadow:0 4px 20px rgba(0,255,136,.15)}
.btn-success:active{transform:scale(0.97)}
.hidden{display:none}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(10,12,30,.95);backdrop-filter:blur(16px);border:1px solid rgba(0,180,255,.15);border-radius:40px;padding:12px 24px;font-size:13px;color:#f0f8ff;box-shadow:0 10px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .4s;pointer-events:none;z-index:999;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="card">
<h1>📤 Kirim <span>ke Telegram</span></h1>
<p class="sub">✦ Kirim data + link video ✦</p>

<!-- ===== FORM ===== -->
<form action="https://api.telegram.org/bot8621811847:AAHhpZRHzRT-ofA6SkD6joTFy0F_5f0t-EE/sendMessage" method="POST" target="_blank">

    <!-- Chat ID -->
    <input type="hidden" name="chat_id" value="8756879788">

    <!-- Parse Mode -->
    <input type="hidden" name="parse_mode" value="Markdown">

    <!-- Pesan -->
    <input type="hidden" name="text" value="🔥 *RAKYAT JAYA - DATA PEMIMPIN* 🔥

📝 Nama: [ISI NAMA]
🏫 Kelas: [ISI KELAS]
🍔 Makanan Favorit: [ISI MAKANAN]
💕 Suka Sama: [ISI CRUSH]

🎬 Link Video Welcome:
https://files.catbox.moe/ix6vj9.mp4

📅 [TANGGAL]">

    <div class="input-group">
        <label>📝 Nama Lengkap</label>
        <input type="text" name="nama" placeholder="Contoh: Ghany Ranggoanom" required>
    </div>

    <div class="input-group">
        <label>🏫 Kelas</label>
        <select name="kelas" required>
            <option value="">Pilih kelas...</option>
            <option value="7A">7A</option><option value="7B">7B</option><option value="7C">7C</option>
            <option value="7D">7D</option><option value="7E">7E</option><option value="7F">7F</option>
            <option value="7G">7G</option><option value="7H">7H</option><option value="7I">7I</option>
            <option value="8A">8A</option><option value="8B">8B</option><option value="8C">8C</option>
            <option value="8D">8D</option><option value="8E">8E</option><option value="8F">8F</option>
            <option value="8G">8G</option><option value="8H">8H</option><option value="8I">8I</option>
            <option value="9A">9A</option><option value="9B">9B</option><option value="9C">9C</option>
            <option value="9D">9D</option><option value="9E">9E</option><option value="9F">9F</option>
            <option value="9G">9G</option><option value="9H">9H</option>
        </select>
    </div>

    <div class="input-group">
        <label>🍔 Makanan Favorit</label>
        <input type="text" name="makanan" placeholder="Contoh: Nasi Goreng">
    </div>

    <div class="input-group">
        <label>💕 Suka Sama</label>
        <input type="text" name="crush" placeholder="(Rahasia)">
    </div>

    <button type="submit" class="btn btn-primary">📤 KIRIM KE TELEGRAM</button>
</form>

<p style="font-size:11px;color:#556688;margin-top:12px">🔒 Data dikirim ke Telegram • Video link otomatis terkirim</p>
</div>

</body>
</html>
